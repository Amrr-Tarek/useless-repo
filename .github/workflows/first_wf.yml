name: first-workflow
on:
  push:
    branches: 
      - dev
      - 'feature-*'
      - main
  pull_request:
    branches:
      - main
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-slim
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echo "$(pwd)" >> myartifact.txt
          mkdir artifacts
          echo "$(ls -ltr)" >> artifacts/list.txt
          echo "$(hostname)" >> artifacts/hostname.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: one_file_test
          path: ./myartifact.txt
  job2:
      name: Job2
      needs: job1
      runs-on: ubuntu-slim
      steps:
        - name: Checking current dir
          run: |
            pwd
            ls -ltr
        - name: Download file artifact
          uses: actions/download-artifact@v8
          with:
            name: one_file_test
        - name: Checking current dir \#2
          run: |
            pwd
            ls -ltr
