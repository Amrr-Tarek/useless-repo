name: first-workflow
on: push
jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: Sample job1 command
        run: echo "Hello, World from job1"
      - name: Checking OS Release for GitHub Hosted Runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 10
  job2:
    name: job2
    runs-on: ubuntu-slim
    steps:
      - name: Checking Hostname
        run: |
          hostname
          whoami
      - name: Testing Multiple Commands
        run: |
          echo "Hello, World"
          echo "Current time is `date`"
          sleep 3
