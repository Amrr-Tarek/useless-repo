name: first-workflow
on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          "python -m pip install --upgrade pip"
          "python -r install requirements"
      - name: Run Tests
        run: "pytest -v"