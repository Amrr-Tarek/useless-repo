name: first-workflow
on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: bruh
  APP_PORT: 80
jobs:
  job1:
    name: Job1
    runs-on: ubuntu-slim
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echo "$(pwd)" >> myartifact.txt
          mkdir artifacts
          echo "$(ls -ltr)" >> artifacts/list.txt
          echo "$(hostname)" >> artifacts/hostname.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: one_file_test
          path: ./myartifact.txt
  job2:
      name: Job2
      needs: job1
      runs-on: ubuntu-slim
      steps:
        - name: Download file artifact
          uses: actions/download-artifact@v8
          with:
            name: one_file_test
        - name: Referring Repo Secret
          run: |
            echo "[INFO] Application password: ${{ secrets.APP_PWD }}"
        - name: Referring Env. vars
          run: |
            echo "[INFO] Running Deployment for $ENV_TYPE with user $APP_USER."
            echo "[INFO] Once deployed, application is accissible at port $APP_PORT"
