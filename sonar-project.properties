sonar.projectKey=amr-io_useless-repo
sonar.organization=amr-io


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=useless-repo
sonar.projectVersion=1.0

# Coverage report path
sonar.python.coverage.reportPaths=reports/coverage.xml
# Unit test report path
sonar.python.xunit.reportPaths=reports/unit-test-results.xml

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.exclusions=**/test_*.py, reports/**, .pytest_cache/**, .github/**
sonar.test_inclusions=**/test_*.py

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8